<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARDE - Careers</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>

    <div id="navbar-slot"></div>
    
    <main style="min-height: 600px; padding: 50px; text-align: center;">
        <h1>Careers at ARDE</h1>
        <p>Join a network of professionals shaping more than 70 organizations. Explore our open roles below.</p>
    </main>

    <div id="footer-slot"></div>

    <script src="../app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Load Navbar and automatically highlight the 'Careers' tab
            loadComponent("navbar-slot", "../components/navbar.html", "nav-career");
            
            // Load Footer
            loadComponent("footer-slot", "../components/footer.html");
        });
    </script>
</body>
</html>
