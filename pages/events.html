<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARDE - Events</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>

    <div id="navbar-slot"></div>
    
    <main style="min-height: 600px; padding: 50px; text-align: center;">

    <div id="footer-slot"></div>

            // Load Navbar and automatically highlight the 'Events' tab

            loadComponent("footer-slot", "../components/footer.html");
        });
    </script>
